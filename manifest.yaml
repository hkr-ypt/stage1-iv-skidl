# =====================================================================
# manifest.yaml — Stage 1 I–V Characterization System (SKiDL project)
# =====================================================================
# Machine-readable summary of the design: blocks, required KiCad libraries,
# components flagged for pin/footprint verification, and the net manifest.
# The authoritative, generated component table is component_manifest.md
# (produced by `python3 main.py`).

project:
  name: Stage 1 I-V Characterization System
  description: >
    Precision bipolar +/-5 V voltage-source I-V characterization instrument with
    4-wire Kelvin sensing, hardware current limiting, defense-in-depth
    protection, and a shared 2.500 V reference for ratiometric measurement.
  source_spec: Stage1_IV_System_Design.md
  tool: SKiDL 2.2.3 (KiCad netlist backend)
  entry_point: main.py
  outputs:
    netlist: stage1_iv.net           # KiCad netlist (import target)
    schematic_top: stage1_iv.kicad_sch   # hierarchical KiCad schematic (top)
    schematic_sheets: [power.kicad_sch, mcu.kicad_sch, dac_sweep.kicad_sch,
                       output_buffer.kicad_sch, current_sense.kicad_sch,
                       voltage_sense.kicad_sch, adc.kicad_sch,
                       protection.kicad_sch]
    component_manifest: component_manifest.md
  totals:
    components: 107
    nets: 66
    sheets: 8

# ---------------------------------------------------------------------
# Symbol strategy
# ---------------------------------------------------------------------
symbol_strategy: >
  The generation environment has no KiCad symbol/footprint libraries installed,
  so every component is declared as a SKiDL-native symbol in
  libraries/custom_symbols.py. Each carries the INTENDED official KiCad library
  identifier (field 'KiCad_Lib') plus MPN and a 'Pins_Verified' provenance flag,
  so the design maps onto real KiCad symbols at import. Connectivity is expressed
  exclusively by pin FUNCTION NAME, never by raw pin number.

# Official KiCad libraries the design maps onto (verify at import time).
required_kicad_libraries:
  - Device                 # R, C, CP, D, D_TVS, LED, Polyfuse, Crystal, FerriteBead
  - Connector              # TestPoint, USB_C_Receptacle_USB2.0, Screw_Terminal
  - Connector_Generic      # Conn_01x0x
  - Switch                 # SW_Push
  - Regulator_Linear       # LD1117S33
  - Reference_Voltage      # REF5025
  - Analog_DAC             # DAC8552
  - Analog_ADC             # ADS1256
  - Amplifier_Operational  # OPA2277, OPA548
  - Amplifier_Instrumentation  # INA128P
  - MCU_ST_STM32F4         # STM32F411RETx
  - Power_Protection       # USBLC6-2SC6

# ---------------------------------------------------------------------
# Hierarchical blocks (sheets)
# ---------------------------------------------------------------------
blocks:
  - sheet: 1
    name: Power Regulation & Reference
    file: blocks/power.py
    fn: create_power_block
    key_parts: [J1, U1 LD1117S33, U2 REF5025, FB1, R31 star-ground]
  - sheet: 2
    name: MCU & Digital I/O
    file: blocks/mcu.py
    fn: create_mcu_block
    key_parts: [U9 STM32F411RET6, Y2, J2 SWD, J3 USB-C, U10 USBLC6]
  - sheet: 3
    name: DAC & Sweep Level-Shift
    file: blocks/dac_sweep.py
    fn: create_dac_block
    key_parts: [U4 DAC8552, U3 OPA2277 buffer+diff-amp]
  - sheet: 4
    name: Power Buffer (Voltage Source Output Stage)
    file: blocks/output_buffer.py
    fn: create_output_buffer_block
    key_parts: [U5 OPA548, R7 ILIM, R9 R_ISO]
  - sheet: 5
    name: Current Sensing
    file: blocks/current_sense.py
    fn: create_current_sense_block
    key_parts: [R10 shunt, U6 INA128P G=4.85]
  - sheet: 6
    name: Voltage Sensing (4-Wire Kelvin)
    file: blocks/voltage_sense.py
    fn: create_voltage_sense_block
    key_parts: [U7 INA128P G=2.0, D1-D4 clamps]
  - sheet: 7
    name: ADC
    file: blocks/adc.py
    fn: create_adc_block
    key_parts: [U8 ADS1256, Y1 7.6800MHz, RC filters]
  - sheet: 8
    name: Protection & DUT Connector
    file: blocks/protection.py
    fn: create_protection_block
    key_parts: [F1 PTC fuse, R30, D5 TVS, J4 DUT]

# ---------------------------------------------------------------------
# UNRESOLVED / VERIFY-BEFORE-FABRICATION  (surfaced, never guessed silently)
# ---------------------------------------------------------------------
components_needing_pin_verification:
  # Pin NAMES/NETS are complete and correct; pin NUMBERS must be pulled from the
  # official KiCad symbol / datasheet before layout.
  placeholder_remap:            # fine-pitch: numbers are sequential placeholders
    - ref: U9
      part: STM32F411RET6
      package: LQFP-64
      kicad_symbol: MCU_ST_STM32F4:STM32F411RETx
      note: >
        Placeholder pin NUMBERS. Port/function pin NAMES (PA4/5/7, PB12-15,
        PA11/12, PA13/14, PH0/1, NRST, BOOT0, PC13, PA0/8/9) are authoritative.
    - ref: U8
      part: ADS1256IDBR
      package: TSSOP-28
      kicad_symbol: Analog_ADC:ADS1256
      note: >
        Placeholder pin NUMBERS. Pin NAMES (AVDD/AGND/DVDD/DGND, VREFP/VREFN,
        AIN0-3, XTAL1/2, SPI, DRDY/RESET/PDWN/SYNC) are authoritative. XTAL1 and
        CLKIN are the same physical pin on the real part (merged in the netlist).
  verify_datasheet:             # small ICs: numbers best-known, confirm mapping
    - {ref: U2, part: REF5025AIDGKT, package: VSSOP-8}
    - {ref: U4, part: DAC8552IDGKR,  package: VSSOP-8}
    - {ref: U5, part: OPA548T,       package: TO-220-7}
    - {ref: U10, part: USBLC6-2SC6,  package: SOT-23-6}
    - {ref: J3, part: USB-C receptacle, package: SMD}

footprints_to_confirm:
  note: >
    Footprint identifiers follow KiCad standard-library naming and should be
    verified against the installed KiCad version. Watch especially:
  items:
    - {ref: U5, footprint: Package_TO_SOT_THT:TO-220-7_Vertical,
       reason: TO-220-7 footprint name varies by KiCad version/heatsink kit}
    - {ref: F1, footprint: Fuse:Fuse_Bourns-MF-RG300,
       reason: pick the exact radial PTC footprint for 0ZRM0010FF1E}
    - {ref: J4, footprint: Connector:Banana_Jack_1x04,
       reason: panel-mount banana build; swap for chosen physical connector}
    - {ref: J3, footprint: Connector_USB:USB_C_Receptacle_GCT_USB4085,
       reason: match to the exact USB-C receptacle purchased}

added_beyond_source_bom:
  - {ref: C43, value: 2.2uF, reason: >
       STM32F4 VCAP1 decoupling required by datasheet; absent from source
       component table. Added for electrical completeness.}

# ---------------------------------------------------------------------
# Net manifest (checked by validation/assertions.py :: a_net_manifest)
# ---------------------------------------------------------------------
net_manifest:
  power:   [+15VA, -15VA, +5VA, +3V3D, AGND, DGND, VREF_2V5]
  digital: [SCK1, MOSI1, CS_DAC, SCK2, MOSI2, MISO2, CS_ADC, DRDY, RESET_ADC]
  analog:  [V_SWEEP, VO_SENSE, FORCE+, FORCE-, SENSE+, SENSE-,
            I_SENSE_OUT, V_SENSE_OUT]

# ---------------------------------------------------------------------
# Schematic generation (generators/schematic.py) — documented decisions
# ---------------------------------------------------------------------
schematic_assumptions:
  - schema: >
      KiCad 7 s-expression .kicad_sch, (version 20230121), generator
      stage1_iv_skidl. kicad-cli was not installed in the generation
      environment, so the stable KiCad 7 schema is emitted; KiCad 8/9
      migrate it on load. The generator never requires KiCad.
  - mechanism: >
      skidl.generate_schematic() was evaluated and rejected: it requires
      installed KiCad symbol libraries for symbol graphics and does not
      emit hierarchical KiCad 7 sheets in a library-less environment.
  - symbols: >
      Generic rectangles synthesized from the SKiDL pin lists and embedded
      per-sheet in (lib_symbols) — fully self-contained, no external
      libraries needed to open. Embedded lib IDs reuse the intended
      official KiCad_Lib identifier (fallback MPN, then ref prefix) so the
      target symbol is documented on the sheet; pin names/numbers are the
      SKiDL pin names/numbers; first half of pins on the left side,
      second half on the right, 2.54 mm pitch, 2.54 mm pin length.
  - symbol_fields: >
      Reference and Value visible; Footprint, Datasheet, MPN, KiCad_Lib,
      Sheet (owning block) hidden; Pins_Verified visible on any part not
      flagged STD so VERIFY-DATASHEET / PLACEHOLDER-REMAP parts stay
      visibly flagged on the schematic.
  - connectivity: >
      Label-based, no point-to-point routing: every connected pin gets a
      5.08 mm wire stub ending in a label carrying the exact SKiDL net
      name. GLOBAL_POWER nets (drive=POWER rails + NET_MANIFEST power
      group: +15VA, -15VA, +5VA, +5V_RAW, +3V3D, VDDA, VBUS, AGND, DGND,
      VREF_2V5) use global labels; nets spanning >=2 blocks use
      hierarchical labels matched by sheet pins on the top sheet (tied
      together there with stubs + local labels); single-block nets use
      local labels. SKiDL no-connect pins get (no_connect) markers.
      Global labels (not power-port symbols) were chosen so no extra
      power symbols need to be synthesized.
  - hierarchy: >
      One child sheet per block, filenames <block>.kicad_sch (power, mcu,
      dac_sweep, output_buffer, current_sense, voltage_sense, adc,
      protection), top sheet stage1_iv.kicad_sch; pages 1-9 in block
      order. Sheet pins are type bidirectional (no direction is asserted).
  - placement: >
      Deterministic row-flow on the 1.27 mm grid (integer grid-unit
      arithmetic): parts in circuit build order, one cell per part sized
      from body + stubs + label text allowances, wrapped into rows;
      smallest fitting landscape paper of A4/A3/A2/A1/A0 per sheet.
  - uuids: >
      UUIDv5 in the fixed namespace uuid5(NAMESPACE_DNS,
      "stage1-iv-skidl.schematic"), keyed by stable object identities
      (e.g. "power:sym:R31"), unique per object and byte-stable across
      runs.
  - netlist_immutability: >
      Schematic generation adds no fields to parts (block tags are plain
      Python attributes set in main.build), so stage1_iv.net is unchanged
      except its volatile (date ...) stamp, which SKiDL rewrites on every
      run regardless.
  - validation: >
      validation/schematic_check.py re-derives connectivity from the
      emitted files (simp_sexp) and compares the (reference, pin, net)
      set against stage1_iv.net (kinparse; two pre-parse text shims fix
      kinparse-incompatible SKiDL 2.2.3 clauses without touching the nets
      section). Exits non-zero on any mismatch.

# ---------------------------------------------------------------------
# Validation
# ---------------------------------------------------------------------
validation:
  erc:
    module: validation/erc.py
    checks: [skidl-ERC (unconnected/drivers/power-flags), missing-footprints,
             duplicate-refs, pin-number-provenance]
    result: 0 errors, 0 warnings
  assertions:
    module: validation/assertions.py
    checks:
      - DAC ref (U4.VREF) and ADC ref (U8.VREFP) share VREF_2V5
      - FORCE+ path = OPA548 -> R9 -> F1 -> R30 -> D5 -> J4
      - Kelvin sense independent from force path
      - ADC uses SPI2, DAC uses SPI1
      - SPI1 and SPI2 are physically separate buses
      - AGND and DGND join only at the R31 star point
      - all required manifest nets exist and are populated
    result: 8/8 PASS
  schematic_check:
    module: validation/schematic_check.py
    checks: [schematic-vs-netlist (ref,pin,net) set equality, part-set match,
             label-class correctness, sheet-pin/hierarchical-label integrity,
             uuid validity+uniqueness, no floating pins / marked no-connects,
             every net >= 2 endpoints]
    result: PASS (295 connections verified across 8 sheets)

# ---------------------------------------------------------------------
# Design assumptions carried from the source spec
# ---------------------------------------------------------------------
assumptions:
  - Discrete ADS1256/DAC8552 ICs (not the Waveshare module) — same silicon.
  - Bare STM32F411RET6 (not a Nucleo) with own SWD/USB/crystal/reset.
  - Bench supply provides +15V/-15V/+5V raw rails.
  - OPA548 native ILIM used instead of a discrete comparator.
  - Sweep range +/-5 V (reach +/-10 V later via R4/R6 10k->20k).
  - Current limit ~= 49 mA (R7 = 1.43 M).
  - E/S MCU control of OPA548 deferred (needs level shifting) — tied enabled.
