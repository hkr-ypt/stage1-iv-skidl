    - {refs: [U6,U7], old: "Amplifier_Instrumentation:INA128P", new: "Amplifier_Instrumentation:INA128"}
    - {refs: [U2], old: "Reference_Voltage:REF5025AID", new: "Reference_Voltage:REF5025ADGK"}
    - {refs: [J3], old: "Connector:USB_C_Receptacle_USB2.0", new: "Connector:USB_C_Receptacle_USB2.0_16P"}
    - {refs: [U8], old: "Analog_ADC:ADS1256", new: "stage1_iv:ADS1256"}
    - {refs: [U5], old: "Amplifier_Operational:OPA548T", new: "stage1_iv:OPA548T"}
  footprints:
    - {refs: [F1], old: "Fuse:Fuse_Bourns-MF-RG300", new: "Fuse:Fuse_Bourns_MF-RG300"}
    - refs: [J1]
      old: "TerminalBlock:TerminalBlock_bornier-4_P5.08mm"
      new: "TerminalBlock_Phoenix:TerminalBlock_Phoenix_MKDS-1,5-4-5.08_1x04_P5.08mm_Horizontal"
    - refs: [U5]
      old: "Package_TO_SOT_THT:TO-220-7_Vertical"
      new: "Package_TO_SOT_THT:TO-220-7_P2.54x3.7mm_StaggerOdd_Lead3.8mm_Vertical"
    - refs: [J4]
      old: "Connector:Banana_Jack_1x04"
      new: "Connector:Banana_Jack_1Pin (x4 -> J4,J5,J6,J7)"
    - refs: [U8]
      old: "Package_SO:TSSOP-28_4.4x9.7mm_P0.65mm"
      new: "Package_SO:SSOP-28_5.3x10.2mm_P0.65mm"
