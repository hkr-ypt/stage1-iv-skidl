unresolved_items:
  - id: opa548-datasheet
    what: TI OPA548 data sheet SBOS070 (pin numbers + TO-220-7 mechanical drawing)
    why: >
      www.ti.com and every datasheet mirror tried are refused by this build
      environment's network egress policy; only github.com, gitlab.com and PyPI
      are reachable. U5's pins therefore come from a pinned commit of the
      Alternate KiCad Library and are flagged VERIFY-DATASHEET.
  - id: kicad-erc-dialog
    what: KiCad ERC violation counts from the ERC dialog, and PCB ratsnest check
    why: >
      kicad-cli sch erc does not exist in KiCad 7, the newest version
      installable here (the KiCad PPA is blocked). tools/kicad_roundtrip.py
      substitutes: kicad-cli exports its own netlist from the schematic and it
      matches stage1_iv.net exactly (307 connections, 66 nets).
  - id: kicad-erc-power-measurement
    what: KiCad ERC violation counts for power_pin_not_driven
    why: >
      kicad-cli sch erc first shipped in KiCad 8; KiCad 7.0.11 is the newest
      version installable here (the KiCad PPA host is refused by the network
      egress policy), so the ERC dialog was never run.
      tools/kicad_erc_power.py substitutes: it evaluates KiCad's power-driver
      rules directly on the emitted .kicad_sch files, which is the artifact
      KiCad ERC reads. Measured 7 -> 0 power_pin_not_driven, 0 driver
      conflicts. This is a re-implementation of the rule, not a KiCad run,
      and is labelled as such wherever quoted.
  - id: kicad-erc-dialog-still-not-run
    what: KiCad ERC violation counts from the ERC dialog itself
    why: >
      kicad-cli sch erc first shipped in KiCad 8 and KiCad 7.0.11 is the newest
      installable version here. Every ERC number this project reports comes
      from re-implementations of KiCad rules evaluated on the emitted
      .kicad_sch files and is labelled as such. CI runs kicad-cli sch erc when
      a runner provides it and prints SKIPPED otherwise.

symbol_strategy_v2:
  chosen: "Strategy 1 - own the symbols"
  what_changed: >
    Every schematic instance now names stage1_iv:<SymbolName> instead of the
    official lib_id. libraries/stage1_iv.kicad_sym is a committed KiCad symbol
    library holding all 25 symbols, and both it and the copy embedded in each
    sheet's (lib_symbols) block are emitted from the SAME SymbolDef objects -
    verified byte-identical for all 25 symbols across all 9 sheets. KiCad's
    lib_symbol_mismatch cannot fire, and lib_symbol_issues cannot fire because
    the only library the schematic needs ships with the repository.
  measured:
    lib_symbol_issues: {before: 105, after_library_repair: 0, after_strategy: 0}
    lib_symbol_mismatch: {before: 2, after_library_repair: 46, after_strategy: 0}
    external_lib_ids_referenced: {before: 24, after: 0}
  given_up:
    - "Generated rectangles instead of familiar KiCad symbol graphics."
    - >
      KiCad_Lib is no longer the link KiCad follows; it stays on every instance
      and is still verified against the installed libraries by
      validation/footprint_check.py whenever they are present.
  build_without_kicad: >
    Supported and CI-tested. Pin data falls back to the committed project
    library and the build reports SKIPPED for every KiCad-conformance check.

netlist_vs_schematic:
  decision: "(b) the schematic is the single source of truth for KiCad"
  netlist_role: documentation and validation input, NOT a PCB input
  rationale: >
    SKiDL's generate_netlist has no hierarchy model matching this design's
    sheets, and netlist import into Pcbnew is the legacy path. Update the PCB
    with "Update PCB from Schematic".
  enforced_by: >
    tools/kicad_roundtrip.py fails if any component in stage1_iv.net acquires a
    non-"/" sheetpath, or if KiCad's reading of the schematic assigns any
    component to a sheet other than the block it was built in.
  migration:
    - "Boards imported from the flat netlist get re-pathed on first Update PCB; footprints match by reference so layout survives."
    - "J4 became J4..J7 in the identifier work - an older board has one 4-pin part where the schematic now has four 1-pin parts. Manual."
    - "The eight #FLG power flags are schematic-only and never reach the board."

added_beyond_source_bom:
  - ref: C43
    value: 2.2uF
    reason: >
      STM32F4 VCAP1 decoupling required by datasheet; absent from source
      component table. Added for electrical completeness.

# ---------------------------------------------------------------------
# Net manifest (checked by validation/assertions.py :: a_net_manifest)
# ---------------------------------------------------------------------
net_manifest:
  power:   [+15VA, -15VA, +5VA, +3V3D, AGND, DGND, VREF_2V5]
  digital: [SCK1, MOSI1, CS_DAC, SCK2, MOSI2, MISO2, CS_ADC, DRDY, RESET_ADC]
  analog:  [V_SWEEP, VO_SENSE, FORCE+, FORCE-, SENSE+, SENSE-,
            I_SENSE_OUT, V_SENSE_OUT]

# ---------------------------------------------------------------------
# Schematic generation (generators/schematic.py) — documented decisions
# ---------------------------------------------------------------------
schematic_assumptions:
  - schema: >
      KiCad 7 s-expression .kicad_sch, (version 20230121), generator
      stage1_iv_skidl. kicad-cli was not installed in the generation
      environment, so the stable KiCad 7 schema is emitted; KiCad 8/9
      migrate it on load. The generator never requires KiCad.
  - mechanism: >
      skidl.generate_schematic() was evaluated and rejected: it requires
      installed KiCad symbol libraries for symbol graphics and does not
      emit hierarchical KiCad 7 sheets in a library-less environment.
  - symbols: >
      Generic rectangles synthesized from the SKiDL pin lists and embedded
      per-sheet in (lib_symbols) — fully self-contained, no external
      libraries needed to open. Embedded lib IDs reuse the intended
      official KiCad_Lib identifier (fallback MPN, then ref prefix) so the
      target symbol is documented on the sheet; pin names/numbers are the
      SKiDL pin names/numbers; first half of pins on the left side,
      second half on the right, 2.54 mm pitch, 2.54 mm pin length.
  - symbol_fields: >
      Reference and Value visible; Footprint, Datasheet, MPN, KiCad_Lib,
      Sheet (owning block) hidden; Pins_Verified visible on any part not
      flagged RESOLVED so VERIFY-DATASHEET parts stay
      visibly flagged on the schematic.
  - connectivity: >
      Label-based, no point-to-point routing: every connected pin gets a
      5.08 mm wire stub ending in a label carrying the exact SKiDL net
      name. GLOBAL_POWER nets (drive=POWER rails + NET_MANIFEST power
      group: +15VA, -15VA, +5VA, +5V_RAW, +3V3D, VDDA, VBUS, AGND, DGND,
      VREF_2V5) use global labels; nets spanning >=2 blocks use
      hierarchical labels matched by sheet pins on the top sheet (tied
      together there with stubs + local labels); single-block nets use
      local labels. SKiDL no-connect pins get (no_connect) markers.
      Global labels (not power-port symbols) were chosen so no extra
      power symbols need to be synthesized.
  - hierarchy: >
      One child sheet per block, filenames <block>.kicad_sch (power, mcu,
      dac_sweep, output_buffer, current_sense, voltage_sense, adc,
      protection), top sheet stage1_iv.kicad_sch; pages 1-9 in block
      order. Sheet pins are type bidirectional (no direction is asserted).
  - placement: >
      Deterministic row-flow on the 1.27 mm grid (integer grid-unit
      arithmetic): parts in circuit build order, one cell per part sized
      from body + stubs + label text allowances, wrapped into rows;
      smallest fitting landscape paper of A4/A3/A2/A1/A0 per sheet.
  - uuids: >
      UUIDv5 in the fixed namespace uuid5(NAMESPACE_DNS,
      "stage1-iv-skidl.schematic"), keyed by stable object identities
      (e.g. "power:sym:R31"), unique per object and byte-stable across
      runs.
  - netlist_immutability: >
      Schematic generation adds no fields to parts (block tags are plain
      Python attributes set in main.build), so stage1_iv.net is unchanged
      except its volatile (date ...) stamp, which SKiDL rewrites on every
      run regardless.
  - validation: >
      validation/schematic_check.py re-derives connectivity from the
      emitted files (simp_sexp) and compares the (reference, pin, net)
      set against stage1_iv.net (kinparse; two pre-parse text shims fix
      kinparse-incompatible SKiDL 2.2.3 clauses without touching the nets
      section). Exits non-zero on any mismatch.

# ---------------------------------------------------------------------
# Validation
# ---------------------------------------------------------------------
validation:
  erc:
    module: validation/erc.py
    scope: >
      SKiDL ERC and KiCad ERC are DIFFERENT CHECKS WITH DIFFERENT COVERAGE.
      A pass here is evidence about the SKiDL circuit and is NOT evidence
      about KiCad ERC.
    skidl_erc_covers: [unconnected pins, no-connect pin also on a real net,
                       nets with < 2 pins, pin-type conflicts,
                       insufficient drive (SKiDL analogue of KiCad
                       power_pin_not_driven; PWR_FLAGs satisfy both)]
    skidl_erc_does_not_cover: [lib_symbol_issues, lib_symbol_mismatch,
                               "symbol not found in library",
                               footprint_link_issues,
                               geometric rules (wire/label/pin overlap,
                               dangling ends, bus errors, sheet-pin mismatch)]
    covered_instead_by: [validation/footprint_check.py,
                         tools/audit_identifiers.py]
    gate: >
      erc_logger error/warning counters are read around the ERC() call and
      cross-checked against the captured message texts; any error, any
      un-allow-listed warning, or any PWR_FLAG invariant violation raises and
      main.py exits non-zero. WARNING_ALLOWLIST is empty.
    result: 0 errors, 0 warnings

  power_flags:
    mechanism: >
      Eight externally-sourced rails each carry one power:PWR_FLAG part
      (a real symbol with a power_out pin, serialised into the netlist and the
      schematic). This REPLACED blocks/nets.py's Net.drive = POWER, which was
      a runtime-only Python attribute: it silenced skidl.ERC() and was never
      written to stage1_iv.net or to any .kicad_sch, so KiCad reported every
      one of those rails as power_pin_not_driven.
    flagged:
      - {net: "+15VA",   source: "bench supply via J1 pin 1",   flag: "#FLG1", file: blocks/power.py}
      - {net: "-15VA",   source: "bench supply via J1 pin 2",   flag: "#FLG2", file: blocks/power.py}
      - {net: "+5V_RAW", source: "bench supply via J1 pin 3",   flag: "#FLG3", file: blocks/power.py}
      - {net: "DGND",    source: "bench supply return, J1 pin 4", flag: "#FLG4", file: blocks/power.py}
      - {net: "+5VA",    source: "+5V_RAW through ferrite FB1", flag: "#FLG5", file: blocks/power.py}
      - {net: "AGND",    source: "analog return; separate net from DGND (R31 star)", flag: "#FLG6", file: blocks/power.py}
      - {net: "VBUS",    source: "USB host via J3",             flag: "#FLG7", file: blocks/mcu.py}
      - {net: "VDDA",    source: "+3V3D through ferrite FB2",   flag: "#FLG8", file: blocks/mcu.py}
    deliberately_not_flagged:
      - {net: "+3V3D",    driver: "U1.VOUT (LD1117S33)", reason: "real on-board driver; a flag would mask a regulator wiring error"}
      - {net: "VREF_2V5", driver: "U2.Vout (REF5025)",   reason: "real on-board driver; same"}
  assertions:
    module: validation/assertions.py
    checks:
      - DAC ref (U4.VREF) and ADC ref (U8.VREFP) share VREF_2V5
      - FORCE+ path = OPA548 -> R9 -> F1 -> R30 -> D5 -> J4
      - Kelvin sense independent from force path
      - ADC uses SPI2, DAC uses SPI1
      - SPI1 and SPI2 are physically separate buses
      - AGND and DGND join only at the R31 star point
      - all required manifest nets exist and are populated
      - "USB-C J3: all 4 GND pads on DGND, all 4 VBUS pads on VBUS,
         both D+ pads tied, both D- pads tied, shield connected"
    result: 9/9 PASS
  footprint_check:
    module: validation/footprint_check.py
    checks: [KiCad_Lib resolves to library+symbol, footprint resolves to
             library+footprint, pin numbers subset of pad names, every pad
             netted or allow-listed no-connect, no PLACEHOLDER-REMAP]
    result: >
      PASS - 110 parts, 356 pads: 307 netted, 49 declared no-connect,
      0 unaccounted. Fault injection (tools/test_guard_fails.sh) confirms all
      five checks fail when a real defect is reintroduced.
  schematic_check:
    module: validation/schematic_check.py
    checks: [schematic-vs-netlist (ref,pin,net) set equality, part-set match,
             label-class correctness, sheet-pin/hierarchical-label integrity,
             uuid validity+uniqueness, no floating pins / marked no-connects,
             every net >= 2 endpoints]
    result: PASS (307 connections verified across 8 sheets)
  update_pcb_noop:
    module: validation/update_pcb_noop.py
    checks: [footprint<->symbol link resolves, pad nets (including the
             synthetic unconnected-(...) nets KiCad creates for open pins),
             sheetname, sheetfile, symbol fields, unit metadata, fabrication
             attributes]
    calibration: validation/fixtures/kicad_update_pcb_baseline.json
    result: >
      PASS - "Update PCB from Schematic" would make 0 changes. This is a model
      of KiCad's BOARD_NETLIST_UPDATER, not KiCad (7.0.11 is the newest
      installable here and cannot open a 20241229 board), so it is calibrated
      first: removing each category from the board reproduces the counts KiCad
      10.0.5 actually reported - 110/110/110/110 for sheetname/sheetfile/
      fields/units, 98 for nets, 16 for fabrication attributes, and 4 for the
      net-name escaping capture. Two KiCad 10.0.5 runs are recorded, not one:
      the second caught net names stored in KiCad's DISPLAY form rather than
      its stored form (EscapeString CTX_NETNAME turns '/' into '{slash}'), a
      difference no log can show because the dialog unescapes before printing.
      self_test also rejects any injection that changes nothing, so a
      generator that stopped escaping cannot take the model down with it.
  kicad_roundtrip:
    module: tools/kicad_roundtrip.py
    checks: [kicad-cli sch export netlist vs stage1_iv.net, symbol/footprint
             identifier resolution]
    result: >
      PASS - KiCad 7.0.11 reads the same 307 connections in the same 66 nets;
      "symbol not found in library" 15 -> 0, footprint_link_issues 4 -> 0.

# ---------------------------------------------------------------------
# Design assumptions carried from the source spec
# ---------------------------------------------------------------------
assumptions:
  - Discrete ADS1256/DAC8552 ICs (not the Waveshare module) — same silicon.
  - Bare STM32F411RET6 (not a Nucleo) with own SWD/USB/crystal/reset.
  - Bench supply provides +15V/-15V/+5V raw rails.
  - OPA548 native ILIM used instead of a discrete comparator.
  - >
    Sweep range +/-10.04 V. V_SWEEP = (R4/R3)*(V_DAC - VREF/2) with
    R4 = R6 = 20.0k and R3 = R5 = 2.49k, i.e. gain 20.0k/2.49k = 8.0321 on a
    +/-1.250 V DAC bracket. 20.0k BRACKETS the +/-10 V target; an exact
    +/-10.000 V would need a non-standard 19.92k, so firmware leaves the top
    0.40% of DAC codes unused.
  - >
    DUT compliance is NOT the sweep range at high current. R30 (100R) plus
    R10 (10R) drop ~5.4 V at the 49 mA ILIM, leaving ~+/-4.6 V across the DUT
    there; the full +/-10.04 V reaches the DUT only at low current.
  - >
    Measurable Kelvin range 0 .. +5.00 V, and UNIPOLAR (U7 at G = 1, R14
    DNP). Three distinct limits sit on this path, not one. The DUT can
    physically sit at +/-10.04 V. The INA128 would pass ~+/-13 V differential
    at G = 1 on +/-15VA. But the ADS1256 has AIN3 and VREFN both on AGND with
    AVDD = +5VA, so its window is +/-2*VREF/PGA = +/-5.000 V floored at
    AGND - 0.1 V. The ADC wiring, not the amplifier, is the limiting stage.
  - >
    No R14 value makes the Kelvin measurement bipolar (the INA128 gain floor
    is G = 1) or reaches +/-10 V (that needs an overall gain of 0.25 and U7's
    REF off AGND). Both are part/net changes, not value changes.
  - Current limit ~= 49 mA (R7 = 1.43 M).
  - E/S MCU control of OPA548 deferred (needs level shifting) — tied enabled.
