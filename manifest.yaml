unresolved_items:
  - id: opa548-datasheet
    what: TI OPA548 data sheet SBOS070 (pin numbers + TO-220-7 mechanical drawing)
    why: >
      www.ti.com and every datasheet mirror tried are refused by this build
      environment's network egress policy; only github.com, gitlab.com and PyPI
      are reachable. U5's pins therefore come from a pinned commit of the
      Alternate KiCad Library and are flagged VERIFY-DATASHEET.
  - id: kicad-erc-dialog
    what: KiCad ERC violation counts from the ERC dialog, and PCB ratsnest check
    why: >
      kicad-cli sch erc does not exist in KiCad 7, the newest version
      installable here (the KiCad PPA is blocked). tools/kicad_roundtrip.py
      substitutes: kicad-cli exports its own netlist from the schematic and it
      matches stage1_iv.net exactly (307 connections, 66 nets).
  - id: lib-symbol-issues
    what: KiCad lib_symbol_issues "library not found" / lib_symbol_mismatch
    why: out of scope per the brief; 12 libraries / 24 lib_ids, unchanged.

added_beyond_source_bom:
  - ref: C43
    value: 2.2uF
    reason: >
      STM32F4 VCAP1 decoupling required by datasheet; absent from source
      component table. Added for electrical completeness.

# ---------------------------------------------------------------------
# Net manifest (checked by validation/assertions.py :: a_net_manifest)
# ---------------------------------------------------------------------
net_manifest:
  power:   [+15VA, -15VA, +5VA, +3V3D, AGND, DGND, VREF_2V5]
  digital: [SCK1, MOSI1, CS_DAC, SCK2, MOSI2, MISO2, CS_ADC, DRDY, RESET_ADC]
  analog:  [V_SWEEP, VO_SENSE, FORCE+, FORCE-, SENSE+, SENSE-,
            I_SENSE_OUT, V_SENSE_OUT]

# ---------------------------------------------------------------------
# Schematic generation (generators/schematic.py) — documented decisions
# ---------------------------------------------------------------------
schematic_assumptions:
  - schema: >
      KiCad 7 s-expression .kicad_sch, (version 20230121), generator
      stage1_iv_skidl. kicad-cli was not installed in the generation
      environment, so the stable KiCad 7 schema is emitted; KiCad 8/9
      migrate it on load. The generator never requires KiCad.
  - mechanism: >
      skidl.generate_schematic() was evaluated and rejected: it requires
      installed KiCad symbol libraries for symbol graphics and does not
      emit hierarchical KiCad 7 sheets in a library-less environment.
  - symbols: >
      Generic rectangles synthesized from the SKiDL pin lists and embedded
      per-sheet in (lib_symbols) — fully self-contained, no external
      libraries needed to open. Embedded lib IDs reuse the intended
      official KiCad_Lib identifier (fallback MPN, then ref prefix) so the
      target symbol is documented on the sheet; pin names/numbers are the
      SKiDL pin names/numbers; first half of pins on the left side,
      second half on the right, 2.54 mm pitch, 2.54 mm pin length.
  - symbol_fields: >
      Reference and Value visible; Footprint, Datasheet, MPN, KiCad_Lib,
      Sheet (owning block) hidden; Pins_Verified visible on any part not
      flagged RESOLVED so VERIFY-DATASHEET parts stay
      visibly flagged on the schematic.
  - connectivity: >
      Label-based, no point-to-point routing: every connected pin gets a
      5.08 mm wire stub ending in a label carrying the exact SKiDL net
      name. GLOBAL_POWER nets (drive=POWER rails + NET_MANIFEST power
      group: +15VA, -15VA, +5VA, +5V_RAW, +3V3D, VDDA, VBUS, AGND, DGND,
      VREF_2V5) use global labels; nets spanning >=2 blocks use
      hierarchical labels matched by sheet pins on the top sheet (tied
      together there with stubs + local labels); single-block nets use
      local labels. SKiDL no-connect pins get (no_connect) markers.
      Global labels (not power-port symbols) were chosen so no extra
      power symbols need to be synthesized.
  - hierarchy: >
      One child sheet per block, filenames <block>.kicad_sch (power, mcu,
      dac_sweep, output_buffer, current_sense, voltage_sense, adc,
      protection), top sheet stage1_iv.kicad_sch; pages 1-9 in block
      order. Sheet pins are type bidirectional (no direction is asserted).
  - placement: >
      Deterministic row-flow on the 1.27 mm grid (integer grid-unit
      arithmetic): parts in circuit build order, one cell per part sized
      from body + stubs + label text allowances, wrapped into rows;
      smallest fitting landscape paper of A4/A3/A2/A1/A0 per sheet.
  - uuids: >
      UUIDv5 in the fixed namespace uuid5(NAMESPACE_DNS,
      "stage1-iv-skidl.schematic"), keyed by stable object identities
      (e.g. "power:sym:R31"), unique per object and byte-stable across
      runs.
  - netlist_immutability: >
      Schematic generation adds no fields to parts (block tags are plain
      Python attributes set in main.build), so stage1_iv.net is unchanged
      except its volatile (date ...) stamp, which SKiDL rewrites on every
      run regardless.
  - validation: >
      validation/schematic_check.py re-derives connectivity from the
      emitted files (simp_sexp) and compares the (reference, pin, net)
      set against stage1_iv.net (kinparse; two pre-parse text shims fix
      kinparse-incompatible SKiDL 2.2.3 clauses without touching the nets
      section). Exits non-zero on any mismatch.

# ---------------------------------------------------------------------
# Validation
# ---------------------------------------------------------------------
validation:
  erc:
    module: validation/erc.py
    checks: [skidl-ERC (unconnected/drivers/power-flags), missing-footprints,
             duplicate-refs, pin-number-provenance]
    result: 0 errors, 0 warnings
  assertions:
    module: validation/assertions.py
    checks:
      - DAC ref (U4.VREF) and ADC ref (U8.VREFP) share VREF_2V5
      - FORCE+ path = OPA548 -> R9 -> F1 -> R30 -> D5 -> J4
      - Kelvin sense independent from force path
      - ADC uses SPI2, DAC uses SPI1
      - SPI1 and SPI2 are physically separate buses
      - AGND and DGND join only at the R31 star point
      - all required manifest nets exist and are populated
      - "USB-C J3: all 4 GND pads on DGND, all 4 VBUS pads on VBUS,
         both D+ pads tied, both D- pads tied, shield connected"
    result: 9/9 PASS
  footprint_check:
    module: validation/footprint_check.py
    checks: [KiCad_Lib resolves to library+symbol, footprint resolves to
             library+footprint, pin numbers subset of pad names, every pad
             netted or allow-listed no-connect, no PLACEHOLDER-REMAP]
    result: >
      PASS - 110 parts, 356 pads: 307 netted, 49 declared no-connect,
      0 unaccounted. Fault injection (tools/test_guard_fails.sh) confirms all
      five checks fail when a real defect is reintroduced.
  schematic_check:
    module: validation/schematic_check.py
    checks: [schematic-vs-netlist (ref,pin,net) set equality, part-set match,
             label-class correctness, sheet-pin/hierarchical-label integrity,
             uuid validity+uniqueness, no floating pins / marked no-connects,
             every net >= 2 endpoints]
    result: PASS (307 connections verified across 8 sheets)
  kicad_roundtrip:
    module: tools/kicad_roundtrip.py
    checks: [kicad-cli sch export netlist vs stage1_iv.net, symbol/footprint
             identifier resolution]
    result: >
      PASS - KiCad 7.0.11 reads the same 307 connections in the same 66 nets;
      "symbol not found in library" 15 -> 0, footprint_link_issues 4 -> 0.

# ---------------------------------------------------------------------
# Design assumptions carried from the source spec
# ---------------------------------------------------------------------
assumptions:
  - Discrete ADS1256/DAC8552 ICs (not the Waveshare module) — same silicon.
  - Bare STM32F411RET6 (not a Nucleo) with own SWD/USB/crystal/reset.
  - Bench supply provides +15V/-15V/+5V raw rails.
  - OPA548 native ILIM used instead of a discrete comparator.
  - Sweep range +/-5 V (reach +/-10 V later via R4/R6 10k->20k).
  - Current limit ~= 49 mA (R7 = 1.43 M).
  - E/S MCU control of OPA548 deferred (needs level shifting) — tied enabled.
