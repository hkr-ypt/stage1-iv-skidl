# =====================================================================
# manifest.yaml — Stage 1 I–V Characterization System (SKiDL project)
# =====================================================================
# Machine-readable summary of the design: blocks, required KiCad libraries,
# components flagged for pin/footprint verification, and the net manifest.
# The authoritative, generated component table is component_manifest.md
# (produced by `python3 main.py`).

project:
  name: Stage 1 I-V Characterization System
  description: >
    Precision bipolar +/-5 V voltage-source I-V characterization instrument with
    4-wire Kelvin sensing, hardware current limiting, defense-in-depth
    protection, and a shared 2.500 V reference for ratiometric measurement.
  source_spec: Stage1_IV_System_Design.md
  tool: SKiDL 2.2.3 (KiCad netlist backend)
  entry_point: main.py
  outputs:
    netlist: stage1_iv.net           # KiCad netlist (import target)
    schematic_top: stage1_iv.kicad_sch   # hierarchical KiCad schematic (top)
    schematic_sheets: [power.kicad_sch, mcu.kicad_sch, dac_sweep.kicad_sch,
                       output_buffer.kicad_sch, current_sense.kicad_sch,
                       voltage_sense.kicad_sch, adc.kicad_sch,
                       protection.kicad_sch]
    component_manifest: component_manifest.md
  totals:
    components: 107
    nets: 66
    sheets: 8

# ---------------------------------------------------------------------
# Symbol strategy
# ---------------------------------------------------------------------
symbol_strategy: >
  Every component is a SKiDL-native part in libraries/custom_symbols.py, but the
  PINS ARE NOT DECLARED THERE: each factory names an official KiCad lib_id and
  tools/resolve_kicad_libs.py reads the pin numbers, names and electrical types
  out of the installed symbol library at build time. A lib_id that does not
  resolve stops the build. Connectivity is still expressed exclusively by pin
  FUNCTION NAME, never by raw pin number; where the official pin name differs
  from the design's, an alias layer keeps both spellings addressing the pin.

# The library revision every pin number, symbol name and footprint name in this
# design was READ from. Reproduce with tools/install_kicad_libs.sh.
kicad_library_revision:
  symbols:
    repository: https://gitlab.com/kicad/libraries/kicad-symbols.git
    tag: 9.0.9.1
    commit: ad36cd14bcd1b1cd0484f629ccdd3481366f74f3
  footprints:
    repository: https://gitlab.com/kicad/libraries/kicad-footprints.git
    tag: 9.0.9.1
    commit: 2b941bf1d97862be429793b46fd52a5add09a2fc

# Official KiCad libraries the design reads from (all verified to exist).
required_kicad_libraries:
  - Device                 # R, C, C_Polarized, D, D_TVS, LED, Polyfuse, Crystal, FerriteBead
  - Connector              # TestPoint, USB_C_Receptacle_USB2.0_16P, Screw_Terminal
  - Connector_Generic      # Conn_01x01, Conn_01x05
  - Switch                 # SW_Push
  - Regulator_Linear       # LD1117S33TR_SOT223
  - Reference_Voltage      # REF5025ADGK
  - Analog_DAC             # DAC8552
  - Amplifier_Operational  # OPA2277
  - Amplifier_Instrumentation  # INA128
  - MCU_ST_STM32F4         # STM32F411RETx
  - Power_Protection       # USBLC6-2SC6

# Parts with NO symbol upstream -> project-local library (registered in
# sym-lib-table, generated by tools/author_project_symbols.py).
project_symbol_library:
  file: libraries/stage1_iv.kicad_sym
  symbols:
    - lib_id: stage1_iv:ADS1256
      source: TI SBAS288K (rev K, Sept 2013), "Terminal Functions" table, page 5
      provenance: libraries/provenance/ads1256_sbas288k_terminal_functions.txt
      status: RESOLVED
    - lib_id: stage1_iv:OPA548T
      source: Alternate KiCad Library @ cf93181d5934eca1b0560f66895f1b06958700f7
      provenance: libraries/provenance/opa548t_akl_symbol.txt
      status: VERIFY-DATASHEET   # TI SBOS070 unreachable; see item below

# ---------------------------------------------------------------------
# Hierarchical blocks (sheets)
# ---------------------------------------------------------------------
blocks:
  - sheet: 1
    name: Power Regulation & Reference
    file: blocks/power.py
    fn: create_power_block
    key_parts: [J1, U1 LD1117S33, U2 REF5025, FB1, R31 star-ground]
  - sheet: 2
    name: MCU & Digital I/O
    file: blocks/mcu.py
    fn: create_mcu_block
    key_parts: [U9 STM32F411RET6, Y2, J2 SWD, J3 USB-C, U10 USBLC6]
  - sheet: 3
    name: DAC & Sweep Level-Shift
    file: blocks/dac_sweep.py
    fn: create_dac_block
    key_parts: [U4 DAC8552, U3 OPA2277 buffer+diff-amp]
  - sheet: 4
    name: Power Buffer (Voltage Source Output Stage)
    file: blocks/output_buffer.py
    fn: create_output_buffer_block
    key_parts: [U5 OPA548, R7 ILIM, R9 R_ISO]
  - sheet: 5
    name: Current Sensing
    file: blocks/current_sense.py
    fn: create_current_sense_block
    key_parts: [R10 shunt, U6 INA128P G=4.85]
  - sheet: 6
    name: Voltage Sensing (4-Wire Kelvin)
    file: blocks/voltage_sense.py
    fn: create_voltage_sense_block
    key_parts: [U7 INA128P G=2.0, D1-D4 clamps]
  - sheet: 7
    name: ADC
    file: blocks/adc.py
    fn: create_adc_block
    key_parts: [U8 ADS1256, Y1 7.6800MHz, RC filters]
  - sheet: 8
    name: Protection & DUT Connector
    file: blocks/protection.py
    fn: create_protection_block
    key_parts: [F1 PTC fuse, R30, D5 TVS, J4 DUT]

# ---------------------------------------------------------------------
# UNRESOLVED / VERIFY-BEFORE-FABRICATION  (surfaced, never guessed silently)
# ---------------------------------------------------------------------
components_needing_pin_verification:
  # placeholder_remap: EMPTY. Sequential placeholder pin numbers no longer exist
  # anywhere in this design; validation/footprint_check.py hard-fails if the
  # PLACEHOLDER-REMAP flag reappears.
  placeholder_remap: []
  verify_datasheet:
    - ref: U5
      part: OPA548T
      package: TO-220-7
      kicad_symbol: stage1_iv:OPA548T
      note: >
        The ONLY part still unverified. TI SBOS070 could not be retrieved (see
        unresolved_items); its seven pin numbers and the TO-220-7 lead stagger
        come from a pinned third-party KiCad library instead. Confirm both
        against the data sheet before fabrication.

footprints_to_confirm:
  note: >
    All footprint identifiers now resolve against kicad-footprints 9.0.9.1;
    validation/footprint_check.py asserts this on every build. What remains is
    a mechanical, not an identifier, question:
  items:
    - ref: U5
      footprint: "Package_TO_SOT_THT:TO-220-7_P2.54x3.7mm_StaggerOdd_Lead3.8mm_Vertical"
      reason: >
        lead stagger parity (StaggerOdd vs StaggerEven) was taken from the
        third-party OPA548T symbol's Footprint property, not from the OPA548
        mechanical drawing. Confirm against SBOS070.

# Identifiers corrected against the installed libraries (full table with the
# file:line every value was read from: docs/identifier_resolution.md).
