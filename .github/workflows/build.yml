name: build

# Everything here uses only environment variables and repo-relative paths.
# There is no absolute path anywhere in this workflow, and no KiCad library is
# vendored into the repository — they are cloned at the revision pinned in
# docs/LIBRARY_DEPENDENCIES.md.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  # The upstream library revision this design's pin numbers were read from.
  # Keep in step with docs/LIBRARY_DEPENDENCIES.md (CI verifies the match).
  KICAD_LIB_TAG: "9.0.9.1"
  KICAD_LIB_ROOT: ${{ github.workspace }}/.kicad-libs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SKiDL and its import-time dependencies
        run: |
          python -m pip install --upgrade pip
          # SKiDL's optional PCB-placement extras are not needed and may fail
          # to build, so install the core without them.
          pip install --no-deps "skidl==2.2.3"
          pip install graphviz future simp_sexp rich ply pyyaml
          # kinparse's setup.py predates modern setuptools; build it with the
          # stdlib distutils shim.
          SETUPTOOLS_USE_DISTUTILS=stdlib pip install --no-build-isolation kinparse

      - name: Install KiCad 10, so the KiCad-side checks really run
        run: |
          # KiCad 10: the board of record carries a footprint (units ...)
          # block KiCad 9 and older cannot read, so on the distro's KiCad 7
          # its DRC could only ever be SKIPPED. Checks that cannot run say
          # SKIPPED, never PASS; this step is what lets them run.
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases \
            || echo "::warning::KiCad 10 PPA unavailable; falling back"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends kicad \
            || echo "::warning::kicad-cli unavailable; KiCad-side checks SKIP"
          kicad-cli version || true
          # pcbnew is what actually runs DRC (WriteDRCReport). It is a SWIG
          # extension built against the DISTRO python, not the one
          # actions/setup-python puts on PATH, so validation/drc_check.py
          # locates a suitable interpreter itself and prints which one ran DRC.

      - name: Cache the pinned KiCad libraries
        id: libcache
        uses: actions/cache@v4
        with:
          path: ${{ env.KICAD_LIB_ROOT }}
          key: kicad-libs-${{ env.KICAD_LIB_TAG }}

      - name: Install the pinned KiCad symbol and footprint libraries
        if: steps.libcache.outputs.cache-hit != 'true'
        run: sudo -E tools/install_kicad_libs.sh "$KICAD_LIB_ROOT" "$KICAD_LIB_TAG"

      - name: Export the library locations
        run: |
          echo "KICAD9_SYMBOL_DIR=$KICAD_LIB_ROOT/symbols" >> "$GITHUB_ENV"
          echo "KICAD9_FOOTPRINT_DIR=$KICAD_LIB_ROOT/footprints" >> "$GITHUB_ENV"

      - name: Environment resolves, and the installation is complete
        run: python3 tools/kicad_env.py --check --diagnose

      - name: Build
        run: python3 main.py

      - name: Generated project library and config are current
        run: |
          python3 tools/author_project_symbols.py --check
          python3 tools/gen_project_config.py --check
          python3 tools/vendor_footprints.py --check

      - name: KiCad itself can read the generated library and schematic
        run: python3 tools/check_kicad_loads.py

      - name: Structural guard
        run: python3 validation/footprint_check.py

      - name: SKiDL ERC gate
        run: python3 validation/erc.py

      - name: Bipolar measurement covers every reachable operating point
        run: python3 validation/measurement_range.py

      - name: Schematic <-> netlist consistency
        run: python3 validation/schematic_check.py

      - name: KiCad power-driver ERC rules
        run: python3 tools/kicad_erc_power.py

      - name: KiCad round-trip (KiCad's own reading of the schematic)
        run: python3 tools/kicad_roundtrip.py

      # Two steps, deliberately separate. The first proves the model of
      # BOARD_NETLIST_UPDATER still reproduces the numbers KiCad 10.0.5
      # actually printed (validation/fixtures/kicad_update_pcb_baseline.json);
      # only then is the second worth anything. A "no changes" verdict from an
      # uncalibrated checker is what this project shipped on silkscreen.
      - name: The Update-PCB model still matches real KiCad output
        run: python3 validation/update_pcb_noop.py --self-test

      - name: Update PCB from Schematic would change nothing
        run: python3 validation/update_pcb_noop.py

      # The board of record: generated from the SKiDL circuit + layout/ (the
      # human-routed board's placement and copper) + layout/bipolar.eco. It
      # must be exactly what those sources generate, agree with the circuit,
      # introduce nothing the original's checks do not already report, and
      # pass KiCad 10 DRC: clean under the rules it was routed to, fully
      # connected, and with no violation of the repository's netclass policy
      # that the original human routing does not already have.
      - name: Board of record (source, parity, heuristics, KiCad DRC)
        run: python3 validation/routed_board_check.py

      - name: The layout source still reproduces the original routed board
        run: python3 tools/reproduce_reference.py

      - name: Board clearances still match the fabrication capability
        run: |
          python3 - <<'PY'
          import sys
          from libraries.netclasses import check_against_fab, NETCLASSES, FAB
          problems = check_against_fab()
          if problems:
              print("FAB CONFORMANCE FAILED:"); print("\n".join(problems))
              sys.exit(1)
          print(f"{len(NETCLASSES)} netclasses conform to "
                f"docs/FAB_CONSTRAINTS.md ({FAB})")
          PY

      - name: The measured pad gap still bounds the global clearance
        run: |
          python3 tools/measure_pad_gaps.py --json > /tmp/gaps.json
          python3 - <<'PY'
          import json, sys
          from libraries.netclasses import GLOBAL_MIN_CLEARANCE, INTRINSIC_MIN_PAD_GAP
          tight = json.load(open("/tmp/gaps.json"))["tightest"]
          measured = tight["min_gap_mm"]
          if abs(measured - INTRINSIC_MIN_PAD_GAP) > 1e-6:
              print(f"::error::libraries/netclasses.py claims the tightest pad "
                    f"gap is {INTRINSIC_MIN_PAD_GAP} mm, but the footprint "
                    f"files measure {measured} mm in {tight['footprint']}. "
                    f"Update the constant and re-derive the global clearance.")
              sys.exit(1)
          if GLOBAL_MIN_CLEARANCE >= measured:
              print(f"::error::global minimum clearance {GLOBAL_MIN_CLEARANCE} "
                    f"mm is not below the measured pad gap {measured} mm")
              sys.exit(1)
          print(f"tightest measured pad gap {measured} mm in "
                f"{tight['footprint']}; global clearance "
                f"{GLOBAL_MIN_CLEARANCE} mm sits below it")
          PY

      - name: Identifier audit — fail on any unresolved identifier
        run: |
          python3 tools/audit_identifiers.py --json > /tmp/audit.json
          python3 - <<'PY'
          import json, sys
          rows = json.load(open("/tmp/audit.json"))["parts"]
          bad_sym = [r["ref"] for r in rows if not r["sym_ok"]]
          bad_fp = [r["ref"] for r in rows
                    if not r["fp_ok"] and not r["footprint"] == ""]
          unaccounted = {r["ref"]: r["unnetted_pads"]
                         for r in rows if r["unnetted_pads"]}
          placeholder = [r["ref"] for r in rows
                         if r["pins_verified"] == "PLACEHOLDER-REMAP"]
          problems = []
          if bad_sym: problems.append(f"unresolved symbols: {bad_sym}")
          if bad_fp: problems.append(f"unresolved footprints: {bad_fp}")
          if unaccounted: problems.append(f"unaccounted pads: {unaccounted}")
          if placeholder: problems.append(f"placeholder provenance: {placeholder}")
          if problems:
              print("AUDIT FAILED:", "; ".join(problems)); sys.exit(1)
          print(f"audit clean: {len(rows)} parts, 0 unresolved, 0 unaccounted pads")
          PY

      - name: Output is deterministic (build twice, compare)
        run: |
          mkdir -p /tmp/run-a /tmp/run-b
          python3 main.py > /dev/null
          cp ./*.kicad_sch stage1_iv.kicad_pcb component_manifest.md /tmp/run-a/
          # The netlist header carries a generation timestamp; drop that one
          # line so the comparison is about content, not wall-clock time.
          sed '/(date /d' stage1_iv.net > /tmp/run-a/netlist
          python3 main.py > /dev/null
          cp ./*.kicad_sch stage1_iv.kicad_pcb component_manifest.md /tmp/run-b/
          sed '/(date /d' stage1_iv.net > /tmp/run-b/netlist
          diff -r /tmp/run-a /tmp/run-b
          echo "output is byte-identical across runs"

      - name: Nothing regenerated is dirty in git
        run: |
          git diff --stat -- ':!stage1_iv.net'
          git diff --quiet -- ':!stage1_iv.net' || {
            echo "::error::committed generated files are stale; run the generators and commit"
            exit 1; }

      - name: No absolute paths in committed files
        run: python3 tools/check_no_abs_paths.py

      - name: The guards actually fail on injected faults
        run: tools/test_guard_fails.sh

      - name: KiCad ERC (only if kicad-cli provides it)
        run: |
          if command -v kicad-cli >/dev/null 2>&1 && \
             kicad-cli sch --help 2>&1 | grep -qw erc; then
            kicad-cli sch erc --exit-code-violations \
              --output /tmp/erc.rpt stage1_iv.kicad_sch
          else
            echo "kicad-cli sch erc unavailable on this runner "
            echo "(it first shipped in KiCad 8) — KiCad ERC SKIPPED, not passed."
          fi

      # The bootstrap auto-placer (generators/pcb.py) is no longer the board
      # of record, but it is how a new design gets a starting placement; keep
      # it emitting a board that passes its own checks. That board is
      # UNROUTED on purpose, so its DRC reports unconnected_items as a routing
      # metric and fails on every other violation class.
      - name: The bootstrap auto-placer still emits a checkable board
        run: python3 main.py --autoplace

  build-without-kicad:
    # The design must build with no KiCad at all, and must then say SKIPPED.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SKiDL and its import-time dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps "skidl==2.2.3"
          pip install graphviz future simp_sexp rich ply pyyaml
          SETUPTOOLS_USE_DISTUTILS=stdlib pip install --no-build-isolation kinparse
      - name: Build with no KiCad libraries present
        run: |
          python3 main.py | tee /tmp/nokicad.log
      - name: The build reported SKIPPED, not a KiCad-conformance pass
        run: |
          grep -q "KiCad libraries ....... NOT FOUND" /tmp/nokicad.log
          grep -q "Symbol resolution ..... SKIPPED" /tmp/nokicad.log
          grep -q "Footprint resolution .. SKIPPED" /tmp/nokicad.log
          grep -q "KiCad ERC ............. NOT RUN" /tmp/nokicad.log
          grep -q "Board .............. SKIPPED" /tmp/nokicad.log
          grep -q "Board checks .......... SKIPPED" /tmp/nokicad.log
          echo "no-KiCad build correctly reports SKIPPED"
      - name: The board was not emitted from guessed geometry
        run: |
          git diff --quiet -- stage1_iv.kicad_pcb || {
            echo "::error::the board changed on a machine with no footprint libraries"
            exit 1; }
          echo "stage1_iv.kicad_pcb untouched without KiCad, as it must be"
